# 实测锚点坐标（4 个锚点版本）
#
# 坐标系：右手系，单位米
# 记录的是【UWB 天线的相位中心】
#
# 注意：锚点 0 已架高到 1.65 m，z 分布为 1.65 / 1.1 / 0.6 / 0，
#       比全共面好，但对 z 的解算仍然偏弱（高度差只有 1.65 m，跨度 5 m）。
#       若三维精度不理想：继续把 1~2 个锚点架到 2.2~2.5 m，
#       或者用 --z <高度> 做固定高度的二维定位。
#       特别注意：改了锚点物理位置后，必须重新抓包再解算（旧数据对应的还是旧坐标）。

anchors:
  0: {x: 0.0, y: 5.0, z: 1.65}
  3: {x: 5.0, y: 5.0, z: 1.1}
  2: {x: 5.0, y: 0.0, z: 0.6}
  7: {x: 0.0, y: 0.0, z: 0.0}
