# 锚点坐标配置（示例，必须换成你自己量出来的坐标）
#
# 坐标系约定（与 Bitcraze 一致）：
#   - 右手坐标系，单位：米
#   - 建议以房间某个角落的地面/墙面交点为原点 (0,0,0)
#   - x/y 沿两个墙面方向，z 向上
#   - 记录的是【UWB 天线的相位中心】，不是外壳或者支架底座
#
# id 必须是锚点在 LPS Node 串口菜单里设置的 address（0-255）
# 用激光测距仪对着墙面量最省事：坐标可以直接读数

anchors:
  0: {x:  0.15, y:  0.15, z: 2.40}
  1: {x:  5.85, y:  0.15, z: 2.40}
  2: {x:  5.85, y:  4.85, z: 2.40}
  3: {x:  0.15, y:  4.85, z: 2.40}
  4: {x:  0.15, y:  0.15, z: 0.25}
  5: {x:  5.85, y:  0.15, z: 0.25}
  6: {x:  5.85, y:  4.85, z: 0.25}
  7: {x:  0.15, y:  4.85, z: 0.25}

# 这个几何布局对应 TDoA2/TDoA3 的官方参考布置：
# 8 个锚点，上下各 4 个，构成一个长方体包络（标签工作在包络内部时精度最好）
# 若只用 TDoA3，锚点数量不限于 8，且可以不共面、跨房间
